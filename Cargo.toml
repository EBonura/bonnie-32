[package]
name = "bonnie-32"
version = "0.2.0"
edition = "2021"
description = "A fantasy console for PS1-era 3D games"
authors = ["ebonura"]

[[bin]]
name = "bonnie-32"
path = "src/main.rs"

[dependencies]
winit = "0.30"
wgpu = "24"
egui = "0.31"
egui-wgpu = "0.31"
egui-winit = "0.31"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
ron = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }
rustysynth = "1.3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cpal = "0.15"
gilrs = "0.11"
indicatif = "0.17"
rfd = "0.15"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
